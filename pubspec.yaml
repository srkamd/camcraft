name: scancraft
description: "ScanCraft - Easy PDF & Doc Scanner"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Google ML Kit Document Scanner & OCR
  google_mlkit_document_scanner: ^0.2.0
  google_mlkit_text_recognition: ^0.13.0

  # PDF generation and viewing
  pdf: ^3.10.8
  printing: ^5.13.1
  open_filex: ^4.4.0

  # File management and sharing
  path_provider: ^2.1.2
  path: ^1.9.0
  share_plus: ^9.0.0
  image_picker: ^1.1.0

  # Image processing
  image: ^4.2.0

  # Local storage & State
  shared_preferences: ^2.2.3
  intl: ^0.19.0

  # UI & Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
